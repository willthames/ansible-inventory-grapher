[tox]
minversion = 1.6
envlist = py{311,312,313}-ansible{218,219,220,devel},py{311,312,313}-flake8

[testenv]
deps =
   ansible218: ansible_core>=2.18.0,<2.19
   ansible219: ansible_core>=2.19.0,<2.20
   ansible220: ansible_core>=2.20.0,<2.21
   ansibledevel: git+https://github.com/ansible/ansible.git
   -rtest-deps.txt
commands = nosetests []

[testenv:flake8]
basepython = python
deps = flake8
commands = flake8 bin/ lib/
